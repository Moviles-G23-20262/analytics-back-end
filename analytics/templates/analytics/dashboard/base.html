<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Campus Swap Dashboard{% endblock %}</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
{% block head %}{% endblock %}
<style>
:root {
  color-scheme: light;
  --page: #f3f2ef;
  --surface-1: #fcfcfb;
  --border: #e1e0db;
  --grid: #e8e7e3;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7973;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --accent-soft: #e7f0fb;
  --danger: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #111110;
    --surface-1: #1a1a19;
    --border: #2f2f2d;
    --grid: #2a2a28;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8e8d84;
    --series-1: #3987e5;
    --series-2: #d95926;
    --series-3: #199e70;
    --accent-soft: #16263a;
    --danger: #f2b8b5;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--text-primary); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: inherit; }
code { font-size: 12px; }

.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 100vh; }
.sidebar { position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; padding: 20px 12px; border-right: 1px solid var(--border); background: var(--surface-1); }
.brand { display: block; padding: 0 8px 16px; font-size: 16px; font-weight: 700; text-decoration: none; }
.brand small { display: block; font-weight: 400; color: var(--text-muted); font-size: 12px; }
.nav-link { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; text-decoration: none; color: var(--text-secondary); }
.nav-link:hover { background: var(--page); }
.nav-link[aria-current="page"] { background: var(--accent-soft); color: var(--text-primary); font-weight: 600; }
.nav-num { flex: none; min-width: 34px; text-align: center; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--border); font-size: 11px; color: var(--text-secondary); }
.nav-link[aria-current="page"] .nav-num { border-color: var(--series-1); color: var(--series-1); }

.content { max-width: 1100px; width: 100%; padding: 24px 24px 56px; }
.hero { margin-bottom: 16px; }
.eyebrow { margin: 0 0 6px; color: var(--text-muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.hero h1 { margin: 0 0 8px; font-size: 28px; line-height: 1.25; font-weight: 650; max-width: 60ch; }
.hero .meta { margin: 0; color: var(--text-secondary); font-size: 13px; }
.answer { background: var(--surface-1); border: 1px solid var(--border); border-left: 4px solid var(--series-1); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
.answer .label { margin: 0 0 2px; color: var(--text-muted); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.answer p.text { margin: 0; font-size: 18px; line-height: 1.4; }

.section-title { margin: 28px 0 10px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 16px; }
.stack { display: grid; gap: 16px; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card h2 { margin: 0 0 2px; font-size: 15px; }
.card .sub { margin: 0 0 12px; color: var(--text-secondary); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.tile .label { color: var(--text-secondary); font-size: 12px; }
.tile .value { font-size: 26px; font-weight: 650; line-height: 1.2; }
.tile .hint { color: var(--text-muted); font-size: 12px; }
.chart-box { position: relative; height: 280px; }
.chart-box.tall { height: 340px; }
.chart-box.short { height: 120px; }
.insights { margin: 0; padding-left: 18px; }
.insights li { margin: 6px 0; }
.method { margin: 0; padding-left: 18px; color: var(--text-secondary); }
.method li { margin: 6px 0; }
.status { margin: 0 0 12px; color: var(--text-muted); }
.status.error { color: var(--danger); }
.status:empty { display: none; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; color: var(--text-secondary); }
select, button.btn, .seg button { font: inherit; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--series-1); position: relative; z-index: 1; }
details { margin-top: 12px; }
summary { cursor: pointer; color: var(--text-secondary); font-size: 13px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th { color: var(--text-secondary); font-weight: 600; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

.heat-wrap { overflow-x: auto; }
.heat { display: grid; gap: 2px; min-width: 620px; }
.heat-col { font-size: 10px; color: var(--text-muted); text-align: left; }
.heat-row { font-size: 12px; color: var(--text-secondary); padding-right: 8px; align-self: center; white-space: nowrap; }
.heat-cell { height: 24px; border-radius: 3px; }
.heat-cell:hover { outline: 2px solid var(--text-primary); outline-offset: -1px; }
.heat-legend { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--text-muted); }
.heat-legend i { width: 18px; height: 10px; border-radius: 2px; display: inline-block; }
.tip { position: fixed; z-index: 2000; display: none; pointer-events: none; padding: 4px 8px; border-radius: 6px; font-size: 12px; background: var(--text-primary); color: var(--surface-1); max-width: 260px; }

.overview { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.q-card { display: flex; flex-direction: column; gap: 8px; text-decoration: none; }
.q-card:hover { border-color: var(--series-1); }
.q-card .num { font-size: 12px; color: var(--text-muted); letter-spacing: .06em; text-transform: uppercase; }
.q-card .q { font-size: 16px; font-weight: 600; line-height: 1.35; }
.q-card .a { color: var(--text-secondary); }
.q-card .go { margin-top: auto; color: var(--series-1); font-size: 13px; }

@media (max-width: 860px) {
  .layout { display: block; }
  .sidebar { position: static; height: auto; display: flex; gap: 6px; overflow-x: auto; padding: 10px 12px; border-right: 0; border-bottom: 1px solid var(--border); }
  .brand { display: none; }
  .nav-link { flex: none; white-space: nowrap; }
  .nav-title { display: none; }
  .content { padding: 16px 16px 48px; }
  .hero h1 { font-size: 22px; }
}
</style>
</head>
<body>
<div class="layout">
  <nav class="sidebar" aria-label="Business questions">
    <a class="brand" href="{% url 'dashboard' %}">Campus Swap<small>Analytics dashboard</small></a>
    <a class="nav-link" href="{% url 'dashboard' %}"{% if not current %} aria-current="page"{% endif %}><span class="nav-num">All</span><span class="nav-title">Overview</span></a>
    {% for q in questions %}
    <a class="nav-link" href="{{ q.url }}"{% if current.number == q.number %} aria-current="page"{% endif %}><span class="nav-num">BQ{{ q.number }}</span><span class="nav-title">{{ q.title }}</span></a>
    {% endfor %}
  </nav>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
<div class="tip" id="tip"></div>
{{ questions|json_script:"questions-data" }}
<script>
const ENDPOINT = "{{ current.endpoint_url|default:'' }}";
const CAMPUS_TZ = "{{ campus_time_zone }}";
const CAMPUS_OFFSET = {{ campus_utc_offset_hours }};
{% include "analytics/dashboard/_dash.js" %}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
